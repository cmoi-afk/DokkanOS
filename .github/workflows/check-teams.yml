name: Check teams and missions
on:
  push:
    paths: [index.html, sw.js, app.js, tools/test_app_dom.cjs, tools/test_sw.cjs, team-engine.js, teams.js, team-worker.js, recent-cards.json, style.css, tools/test_team_builder.cjs, catalog-model.js, catalogue.js, catalogue-report.json, tools/test_catalogue.cjs, events.json, tools/test_teams.cjs, tools/import_events.py, .github/workflows/check-teams.yml]
  pull_request:
    paths: [app.js, tools/test_app_dom.cjs, tools/test_sw.cjs, team-engine.js, teams.js, team-worker.js, recent-cards.json, style.css, tools/test_team_builder.cjs, catalog-model.js, catalogue.js, catalogue-report.json, tools/test_catalogue.cjs, events.json, index.html, sw.js, tools/test_teams.cjs, tools/import_events.py, .github/workflows/check-teams.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check team-engine.js && node --check teams.js && node --check app.js && node --check team-worker.js && node --check catalog-model.js && node --check catalogue.js
      - run: node tools/test_teams.cjs
      - run: node tools/test_team_builder.cjs
      - run: node tools/test_catalogue.cjs
      - run: node tools/test_v071.cjs
      - run: node tools/test_sw.cjs
      - run: npm install --prefix /tmp/dokkan-tests --no-save --ignore-scripts linkedom@0.18.12
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_app_dom.cjs
      - run: python -c "import json; from tools.import_events import validate; print(validate(json.load(open('events.json'))))"
