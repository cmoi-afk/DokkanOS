name: Collect GLOBAL French events
on:
  push:
    branches: [feat/events-v16]
    paths: [tools/refresh_events.py, .github/workflows/refresh-events.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/refresh_events.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-source
          path: event-source
          retention-days: 7
