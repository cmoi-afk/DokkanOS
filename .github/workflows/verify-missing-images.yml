name: Verify missing images v0.7
on:
  push:
    branches: [main]
    paths:
      - tools/verify_missing_images.py
      - .github/workflows/verify-missing-images.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_missing_images.py
      - name: Commit verified images
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json docs/IMAGE-AUDIT-v0.7.json
          git commit -m "Fill source-verified catalogue images"
          git pull --rebase origin main
          git push origin HEAD:main
