name: Discover French event image sources
on:
  push:
    branches: [main]
    paths: [tools/discover_event_images.py, .github/workflows/discover-event-images.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tools/discover_event_images.py
      - name: Save source discovery
        run: |
          git config user.name 'DokkanOS event assets'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/event-image-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record observed French event image sources'
            git push
          fi
