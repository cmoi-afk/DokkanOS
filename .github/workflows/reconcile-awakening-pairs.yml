name: Verify awakening pairs v0.7
on:
  push:
    branches: [data/catalog-fr-completion-v07]
    paths:
      - tools/reconcile_awakening_pairs.py
      - .github/workflows/reconcile-awakening-pairs.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/catalog-fr-completion-v07
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/reconcile_awakening_pairs.py
      - name: Commit verified links
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog.json docs/AWAKENING-PAIR-AUDIT-v0.7.json docs/CATALOG-AUDIT-v0.7.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Link verified adjacent awakening forms"
          git pull --rebase origin data/catalog-fr-completion-v07
          git push origin HEAD:data/catalog-fr-completion-v07
