name: Resolve catalogue unknowns v0.7
on:
  push:
    branches: [data/catalog-fr-completion-v07]
    paths:
      - tools/resolve_catalog_unknown.py
      - .github/workflows/resolve-catalog-unknown.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/catalog-fr-completion-v07
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact French card source
        run: |
          python - <<'PY'
          import re, urllib.request
          url = "https://www.dbz-dokkanbattle.com/card/1005050"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              text = urllib.request.urlopen(req, timeout=25).read().decode("utf-8", "ignore")
              print("Page length", len(text))
              for pattern in ("1005050", "cha_rare_sm_", "og:image", "rarity", "SSR", "card_1005050"):
                  hits = list(re.finditer(re.escape(pattern), text, re.I))
                  print(pattern, len(hits))
                  for m in hits[:3]:
                      print(re.sub(r"\\s+", " ", text[max(0, m.start()-130):m.end()+150]))
          except Exception as exc:
              print("Diagnostic:", repr(exc))
          PY
      - run: python tools/resolve_catalog_unknown.py
      - name: Commit verified catalogue data and unresolved report
        run: |
          git config user.name "DokkanOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json docs/CATALOG-UNKNOWN-v0.7.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: verify pending catalogue metadata by exact DokkanInfo ID"
          git pull --rebase origin data/catalog-fr-completion-v07
          git push origin HEAD:data/catalog-fr-completion-v07
