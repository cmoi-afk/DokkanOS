name: Verify SR awakenings v0.7
on:
  push:
    branches: [data/catalog-fr-completion-v07]
    paths:
      - tools/reconcile_sr_awakenings.py
      - .github/workflows/reconcile-sr.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/catalog-fr-completion-v07
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/reconcile_sr_awakenings.py
      - name: Commit verified SR
        run: |
          git config user.name "DokkanOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json docs/SR-AWAKENING-AUDIT-v0.7.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: add SR with verified awakening links"
          git pull --rebase origin data/catalog-fr-completion-v07
          git push origin HEAD:data/catalog-fr-completion-v07
