name: Check teams and missions
on:
  push:
    paths: [progress-model.js, progression.js, sync.js, progress-data.json, boss-profiles.json, tools/test_progression.cjs, copilot.js, copilot-model.js, copilot-worker.js, visual-index.json, events-preview.json, tools/test_copilot.cjs, events.js, event-model.js, tools/test_events.cjs, tools/test_event_dom.cjs, index.html, sw.js, app.js, tools/test_app_dom.cjs, tools/test_sw.cjs, team-engine.js, teams.js, team-worker.js, recent-cards.json, style.css, interface.css, interface.js, companion.js, companion-model.js, tools/test_companion.cjs, tools/test_team_builder.cjs, catalog-model.js, catalogue.js, catalogue-report.json, catalog.json, card-meta.json, tools/test_catalogue_data.cjs, tools/test_catalogue.cjs, events.json, tools/test_teams.cjs, tools/import_events.py, .github/workflows/check-teams.yml]
  pull_request:
    paths: [progress-model.js, progression.js, sync.js, progress-data.json, boss-profiles.json, tools/test_progression.cjs, copilot.js, copilot-model.js, copilot-worker.js, visual-index.json, events-preview.json, tools/test_copilot.cjs, events.js, event-model.js, tools/test_events.cjs, tools/test_event_dom.cjs, app.js, tools/test_app_dom.cjs, tools/test_sw.cjs, team-engine.js, teams.js, team-worker.js, recent-cards.json, style.css, interface.css, interface.js, companion.js, companion-model.js, tools/test_companion.cjs, tools/test_team_builder.cjs, catalog-model.js, catalogue.js, catalogue-report.json, catalog.json, card-meta.json, tools/test_catalogue_data.cjs, tools/test_catalogue.cjs, events.json, index.html, sw.js, tools/test_teams.cjs, tools/import_events.py, .github/workflows/check-teams.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check team-engine.js && node --check teams.js && node --check app.js && node --check team-worker.js && node --check catalog-model.js && node --check catalogue.js
      - run: node --check events.js && node --check event-model.js && node --check interface.js && node --check companion.js && node --check companion-model.js
      - run: node --check copilot.js && node --check copilot-model.js && node --check copilot-worker.js
      - run: node --check progression.js && node --check progress-model.js && node --check sync.js
      - run: node tools/test_progression.cjs
      - run: node tools/test_copilot.cjs
      - run: node tools/test_companion.cjs
      - run: node tools/test_events.cjs
      - run: node tools/test_teams.cjs
      - run: node tools/test_rotation_timing.cjs
      - run: node tools/test_team_builder.cjs
      - run: node tools/test_team_quality.cjs
      - run: node tools/test_catalogue.cjs
      - run: node tools/test_catalogue_data.cjs
      - run: node tools/test_v071.cjs
      - run: node tools/test_sw.cjs
      - run: npm install --prefix /tmp/dokkan-tests --no-save --ignore-scripts linkedom@0.18.12
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_event_dom.cjs
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_app_dom.cjs
      - run: python -c "import json; from tools.import_events import validate; print(validate(json.load(open('events.json'))))"
