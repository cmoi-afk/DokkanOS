name: Probe live catalogue sources v4
on:
  push:
    branches: [feat/catalogue-v4]
    paths: [tools/probe_catalog_sources_v4.py, .github/workflows/catalogue-v4-probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probe_catalog_sources_v4.py
      - name: Save source verification
        run: |
          git config user.name "DokkanOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/CATALOG-SOURCES-PROBE-v4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit live catalogue sources and awakening variants"
          git push
