name: Repair Dokkan card artwork
on:
  workflow_dispatch:
  push:
    branches: [audit-fr-images-v1]
    paths: [".github/workflows/repair-assets.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-fr-images-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve and download exact artwork from French card pages
        run: |
          python - <<'PY'
          import json,re,time,urllib.request,urllib.parse
          from pathlib import Path
          cat=json.loads(Path("catalog.json").read_text(encoding="utf-8"))
          out=Path("assets/cards"); out.mkdir(parents=True,exist_ok=True)
          exts=(".webp",".png",".jpg",".jpeg")
          ua={"User-Agent":"Mozilla/5.0 DokkanOS artwork repair"}
          fixed=[]; unresolved=[]; mappings={}
          def local(rid):
              return next((out/(rid+e) for e in exts if (out/(rid+e)).exists()),None)
          for n,c in enumerate(cat.get("cards",[]),1):
              cid=str(c.get("id") or "")
              if not cid: continue
              explicit=str(c.get("resourceId") or c.get("resource_id") or c.get("imageId") or "")
              if explicit and local(explicit): continue
              if not explicit and local(cid): continue
              try:
                  req=urllib.request.Request("https://www.dbz-dokkanbattle.com/card/"+cid,headers=ua)
                  html=urllib.request.urlopen(req,timeout=20).read().decode("utf-8","ignore")
                  # Accept only card artwork IDs actually embedded by the requested French card page.
                  pats=[
                    r'(?:card_|cha_)(\d{7})[^"\']*?(?:thumb|card)[^"\']*?\.(?:png|webp)',
                    r'(?:thumb|card)[^"\']*?(?:card_|cha_)(\d{7})[^"\']*?\.(?:png|webp)',
                    r'https?://[^"\']+/(?:card_|cha_)(\d{7})[^"\']*?\.(?:png|webp)'
                  ]
                  ids=[]
                  for p in pats: ids += re.findall(p,html,re.I)
                  ids=list(dict.fromkeys(ids))
                  # Prefer explicit id, then exact logical id, otherwise require one unambiguous page artwork id.
                  # The French card page lists its own primary artwork first. For awakening
                  # logical IDs ending in 1, accept the adjacent ...0 only when it is literally
                  # the first artwork resource exposed by that exact requested page.
                  adjacent=(cid[:-1]+"0") if cid.endswith("1") else ""
                  rid=explicit if explicit in ids else (cid if cid in ids else (adjacent if adjacent and ids and ids[0]==adjacent else (ids[0] if len(ids)==1 else "")))
                  if not rid:
                      unresolved.append((cid,ids[:8])); continue
                  # Locate a concrete image URL containing the selected resource id.
                  urls=re.findall(r'''(?:src|data-src|content)=["']([^"']+%s[^"']+\.(?:png|webp)(?:\?[^"']*)?)["']'''%re.escape(rid),html,re.I)
                  urls=[urllib.parse.urljoin("https://www.dbz-dokkanbattle.com/card/"+cid,u.replace("&amp;","&")) for u in urls]
                  if not urls:
                      unresolved.append((cid,ids[:8])); continue
                  data=None; suffix=".webp"
                  for url in urls:
                      try:
                          rr=urllib.request.urlopen(urllib.request.Request(url,headers=ua),timeout=20)
                          blob=rr.read()
                          if len(blob)>3000:
                              data=blob
                              ct=(rr.headers.get("content-type") or "").lower()
                              suffix=".png" if "png" in ct or ".png" in url.lower() else ".webp"
                              break
                      except Exception: pass
                  if not data:
                      unresolved.append((cid,ids[:8])); continue
                  target=out/(rid+suffix); target.write_bytes(data)
                  mappings[cid]=rid; fixed.append((cid,rid,target.name))
              except Exception as e:
                  unresolved.append((cid,[type(e).__name__]))
              if n%40==0: time.sleep(.5)
          Path("artwork-repair-report.json").write_text(json.dumps({"fixed":fixed,"unresolved":unresolved,"resourceId":mappings},ensure_ascii=False,indent=2),encoding="utf-8")
          print("downloaded",len(fixed),"unresolved",len(unresolved))
          PY
      - name: Apply verified resourceId mappings to catalogue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("catalog.json"); cat=json.loads(p.read_text(encoding="utf-8"))
          rep=json.loads(Path("artwork-repair-report.json").read_text(encoding="utf-8"))
          mp=rep.get("resourceId",{})
          for c in cat.get("cards",[]):
              cid=str(c.get("id") or "")
              if cid in mp and mp[cid]!=cid: c["resourceId"]=mp[cid]
          p.write_text(json.dumps(cat,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          PY
      - name: Commit repaired artwork
        run: |
          git config user.name "dokkanos-artwork-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/cards catalog.json artwork-repair-report.json
          if git diff --cached --quiet; then
            echo "No verified artwork repairs found"
          else
            git commit -m "Assets: import verified French-page artwork and resource mappings"
            git push origin HEAD:audit-fr-images-v1
          fi
