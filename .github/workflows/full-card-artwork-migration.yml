name: Full card artwork migration
on:
  workflow_dispatch:
  push:
    branches: [audit-fr-images-v1]
    paths:
      - 'tools/build_full_card_render_manifest_v1.py'
      - 'tools/acquire_full_card_assets_v1.py'
      - '.github/workflows/full-card-artwork-migration.yml'
permissions:
  contents: write
concurrency:
  group: full-card-artwork-migration-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  migrate:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build manifest
        run: python tools/build_full_card_render_manifest_v1.py
      - name: Acquire source assets
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
        run: python tools/acquire_full_card_assets_v1.py
      - name: Stage shard result
        run: |
          mkdir -p shard-output/docs shard-output/assets
          cp docs/FULL-CARD-RENDER-MANIFEST-v1.json shard-output/docs/
          cp docs/FULL-CARD-ASSET-ACQUISITION-v2-shard-${{ matrix.shard }}.json shard-output/docs/
          if [ -d assets/card-source ]; then
            mkdir -p shard-output/assets/card-source
            cp -a assets/card-source/. shard-output/assets/card-source/
          fi
      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: full-card-shard-${{ matrix.shard }}
          path: shard-output/
          if-no-files-found: error
          retention-days: 1

  consolidate:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: full-card-shard-*
          path: shard-results
      - name: Consolidate shard results
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(shard-results/full-card-shard-*/docs/FULL-CARD-ASSET-ACQUISITION-v2-shard-*.json)
          if [ "${#reports[@]}" -ne 8 ]; then
            echo "Expected 8 shard reports, found ${#reports[@]}"
            exit 1
          fi
          mkdir -p docs assets/card-source
          manifest=(shard-results/full-card-shard-*/docs/FULL-CARD-RENDER-MANIFEST-v1.json)
          cp "${manifest[0]}" docs/FULL-CARD-RENDER-MANIFEST-v1.json
          for report in "${reports[@]}"; do cp "$report" docs/; done
          for dir in shard-results/full-card-shard-*/assets/card-source; do
            [ -d "$dir" ] && cp -a "$dir"/. assets/card-source/
          done
      - name: Commit consolidated reports and assets
        run: |
          set -euo pipefail
          git config user.name "dokkanos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/FULL-CARD-RENDER-MANIFEST-v1.json docs/FULL-CARD-ASSET-ACQUISITION-v2-shard-*.json assets/card-source || true
          git diff --cached --quiet && exit 0
          git commit -m "Acquire full-card source assets"
          git pull --rebase origin audit-fr-images-v1
          git push origin HEAD:audit-fr-images-v1
