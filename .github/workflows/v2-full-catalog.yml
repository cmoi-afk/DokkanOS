name: Build DokkanOS V2 full catalogue
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot source pages
        run: |
          mkdir -p /tmp/v2sources
          curl -L --fail --retry 3 'https://dokkanbattle.net/cards' -o /tmp/v2sources/structural.html
          curl -L --fail --retry 3 'https://dbz-dokkanbattle.com/cards' -o /tmp/v2sources/french.html
          python - <<'PY'
          import json,re
          from pathlib import Path
          a=Path('/tmp/v2sources/structural.html').read_text(errors='ignore')
          b=Path('/tmp/v2sources/french.html').read_text(errors='ignore')
          report={
            'structuralBytes':len(a),'frenchBytes':len(b),
            'structuralHasNextData':'__NEXT_DATA__' in a,
            'frenchHasNextData':'__NEXT_DATA__' in b,
            'structuralNumericIds':len(set(re.findall(r'(?<!\\d)10\\d{5}(?!\\d)',a))),
            'frenchNumericIds':len(set(re.findall(r'(?<!\\d)10\\d{5}(?!\\d)',b))),
            'status':'source_snapshot_complete'
          }
          Path('v2/FULL-CATALOG-SOURCE-PROBE.json').write_text(json.dumps(report,indent=2)+'\n')
          print(report)
          PY
      - name: Commit source probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/FULL-CATALOG-SOURCE-PROBE.json
          git commit -m "Probe live sources for V2 full catalogue extraction" || exit 0
          git push
