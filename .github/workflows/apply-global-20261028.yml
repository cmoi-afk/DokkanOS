name: Apply reviewed GLOBAL update 28 October 2026
on:
  push:
    branches: [main]
    paths: [docs/global-20261028.patch.zlib.b64, .github/workflows/apply-global-20261028.yml]
permissions:
  contents: write
concurrency:
  group: global-reviewed-20261028
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed patch
        run: |
          python - <<'PY'
          import base64,zlib,subprocess,pathlib
          patch=zlib.decompress(base64.b64decode(pathlib.Path('docs/global-20261028.patch.zlib.b64').read_bytes()))
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          PY
      - name: Validate application and data
        run: |
          node tools/test_tournaments.cjs
          node tools/test_global_update.cjs
          node tools/test_data_download.cjs
          node tools/test_catalogue_data.cjs
          node tools/test_events.cjs
          node tools/test_sw.cjs
          git diff --check
      - name: Save tested update
        run: |
          git config user.name 'DokkanOS data update'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -u
          git add assets/cards/1034680.webp tournament-model.js tournaments.js tools/test_tournaments.cjs
          git commit -m 'Release DokkanOS v2.14.0 with tournament records and verified October 28 data'
          git push origin HEAD:main
