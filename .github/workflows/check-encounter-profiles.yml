name: Check encounter profiles
on:
  pull_request:
    paths: [team-engine.js, teams.js, events.js, boss-profiles.json, team-worker.js, tools/test_encounter_profiles.cjs, tools/audit_encounter_profiles_browser.cjs, .github/workflows/check-encounter-profiles.yml]
permissions:
  contents: read
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/test_encounter_profiles.cjs && node tools/test_boss_teams.cjs && node tools/test_joint_missions.cjs && node tools/test_team_quality.cjs
      - run: npm install --prefix /tmp/dokkan-tests --no-save --ignore-scripts linkedom@0.18.12 playwright@1.58.2
      - run: /tmp/dokkan-tests/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_team_ui.cjs && NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_event_dom.cjs
      - run: |
          python -m http.server 8765 >/tmp/encounter-server.log 2>&1 &
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_encounter_profiles_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encounter-profiles-mobile-desktop
          path: audit-artifacts
