name: Enrich Dokkan metadata
on:
  workflow_dispatch:
  push:
    branches: [dev/v0.3-foundations]
    paths: [data.json, tools/enrich_identity.py, tools/enrich_dokkaninfo.py, tools/localize_fr.py, tools/dedupe_overlaps.py, tools/build_overlap_conflicts.py, tools/build_catalog.py]
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3-foundations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/dedupe_overlaps.py
      - run: python tools/build_overlap_conflicts.py
      - run: python tools/enrich_identity.py
      - run: python tools/enrich_dokkaninfo.py
      - run: python tools/retry_incomplete.py
      - run: python tools/localize_fr.py
      - run: python tools/build_catalog.py
      - run: python tools/audit_card_data.py
      - run: python tools/audit_semantic.py
      - name: Commit metadata
        run: |
          if git diff --quiet card-meta.json catalog.json collection.json overlap-map.json overlap-conflicts.json data-quality.json semantic-quality.json semantic-quality.json data-quality.json overlap-conflicts.json; then exit 0; fi
          git config user.name "DokkanOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add card-meta.json catalog.json collection.json overlap-map.json overlap-conflicts.json data-quality.json semantic-quality.json
          git commit -m "data: enrich and audit Dokkan card metadata"
          git pull --rebase origin dev/v0.3-foundations
          git push origin HEAD:dev/v0.3-foundations
