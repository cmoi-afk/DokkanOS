name: Apply validated catalogue v1 resource images
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/apply_resource_images_v1.py"
      - ".github/workflows/apply-resource-images-v1.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated mappings
        run: python tools/apply_resource_images_v1.py
      - name: Commit updated draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-v1.draft.json docs/IMAGE-MIGRATION-v1-APPLY.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply 543 validated resource-ID images to catalogue v1"
            git push
          fi
