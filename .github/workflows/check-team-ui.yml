name: Check readable teams
on:
  pull_request:
    paths: [frontier.js, frontier-model.js, frontier-worker.js, frontier.css, frontier-data.json, tools/test_frontier.cjs, tools/test_frontier_dom.cjs, tools/audit_frontier_browser.cjs, team-search.js, team-engine.js, team-worker.js, tools/test_team_performance.cjs, tools/audit_team_performance_browser.cjs, teams.js, teams-ui.js, teams-ui.css, experience.js, sa-farm.js, index.html, sw.js, tools/test_team_ui.cjs, tools/audit_team_ui_browser.cjs, battlefield.js, battlefield-model.js, battlefield-worker.js, battlefield.css, battlefield-data.json, companion-model.js, tools/test_battlefield.cjs, tools/test_battlefield_dom.cjs, tools/audit_battlefield_browser.cjs, .github/workflows/check-team-ui.yml]
permissions:
  contents: read
jobs:
  mobile-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/dokkan-tests --no-save --ignore-scripts linkedom@0.18.12 playwright@1.58.2
      - run: /tmp/dokkan-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tools/test_team_performance.cjs
      - run: node tools/test_cross_category_leaders.cjs
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_team_ui.cjs
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_sa_farm.cjs
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_catalog_teams_dom.cjs
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_team_final_forms.cjs
      - run: node tools/test_frontier.cjs
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_frontier_dom.cjs
      - run: node tools/test_battlefield.cjs
      - run: NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_battlefield_dom.cjs
      - run: |
          python -m http.server 8765 >/tmp/team-ui-http.log 2>&1 &
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_frontier_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_battlefield_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_team_ui_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_team_performance_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-ui-mobile-desktop
          path: audit-artifacts
