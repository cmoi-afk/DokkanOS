name: Refresh complete French catalogue v4
on:
  push:
    branches: [feat/catalogue-v4]
    paths: [tools/refresh_catalogue_v4.py, .github/workflows/catalogue-v4-refresh.yml]
permissions:
  contents: write
concurrency:
  group: catalogue-v4-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - uses: actions/cache@v4
        with:
          path: data-cache/catalogue-v4
          key: catalogue-v4-20260930-${{ github.run_id }}
          restore-keys: catalogue-v4-20260930-
      - run: python -m py_compile tools/refresh_catalogue_v4.py
      - run: python tools/refresh_catalogue_v4.py
      - name: Save reviewed data and images
        run: |
          git config user.name "DokkanOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json card-meta.json catalogue-report.json docs/CATALOG-AUDIT-v4.json assets/cards
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh all released SSR UR LR, French kits, Z versions and exact local images"
          git pull --rebase origin feat/catalogue-v4
          git push origin HEAD:feat/catalogue-v4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue-audit-v4
          path: docs/CATALOG-AUDIT-v4.json
