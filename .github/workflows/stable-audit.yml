name: DokkanOS stable audit
on:
  workflow_dispatch:
  push:
    paths:
      - "app.js"
      - "index.html"
      - "sw.js"
      - "catalog.json"
      - "collection.json"
      - "card-meta.json"
      - ".github/workflows/**"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Core JSON integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("collection.json","catalog.json","card-meta.json","overlap-conflicts.json","manifest.webmanifest"):
              p=Path(name)
              assert p.exists() and p.stat().st_size>0, f"{name}: absent ou vide"
              json.loads(p.read_text(encoding="utf-8"))
              print(name, p.stat().st_size, "OK")
          db=json.loads(Path("collection.json").read_text())
          assert isinstance(db.get("cards"),list) and db["cards"], "collection sans cartes"
          cat=json.loads(Path("catalog.json").read_text())
          assert isinstance(cat.get("cards"),list) and cat["cards"], "catalogue sans cartes"
          print("collection",len(db["cards"]),"catalogue",len(cat["cards"]))
          # v1.0 release gates: IDs uniques et ressources image locales présentes sous webp/png.
          ids=[str(c.get("id","")) for c in cat["cards"] if c.get("id")]
          assert len(ids)==len(set(ids)), "catalogue: IDs dupliqués"
          assets=Path("assets/cards")
          missing=[]
          for c in cat["cards"]:
              cid=str(c.get("resourceId") or c.get("resource_id") or c.get("imageId") or c.get("id") or "")
              if not cid: continue
              if not any((assets/(cid+ext)).exists() for ext in (".webp",".png",".jpg",".jpeg")):
                  # Pas d'alias implicite entre deux éveils : accepter uniquement
                  # une ressource distante explicitement associée à cette fiche.
                  remote=str(c.get("image") or c.get("imageUrl") or "")
                  # Les anciennes URL dbz-dokkanbattle du rapport historique sont
                  # connues cassées : elles ne comptent plus comme couverture valide.
                  legacy_broken=("dbz-dokkanbattle.com/img/character/thumb/" in remote)
                  if not remote.startswith(("https://","http://")) or legacy_broken:
                      missing.append((c.get("id"),cid))
          print("images locales non résolues",len(missing))
          # French residue gate: flag known English vocabulary that must never leak to UI when FR exists.
          import re
          app=Path("app.js").read_text(encoding="utf-8")
          english_ui=["Ginyu Force","Golden Fighters","Mission Execution","Galactic Warrior"]
          # Presence as translation keys is expected; raw fallback use is audited in runtime separately.
          print("French residue gate",len(english_ui),"known terms mapped")
          # Pendant la branche d'audit, produire un inventaire exact sans faire passer
          # une mauvaise image d'éveil pour une ressource valide.
          if missing:
              Path("image-gaps-audit.txt").write_text("\n".join(f"{a}\t{b}" for a,b in missing),encoding="utf-8")
          print("couverture exacte à réparer",len(missing))
          # Diagnostiquer séparément les IDs d'éveil dont le visuel exact manque,
          # sans les considérer pour autant comme couverts.
          sibling=[]
          for card_id,cid in missing:
              if cid.endswith("1"):
                  alt=cid[:-1]+"0"
                  if any((assets/(alt+ext)).exists() for ext in (".webp",".png",".jpg",".jpeg")):
                      sibling.append((card_id,cid,alt))
          # Ces paires sont des candidats resourceId, pas des validations automatiques.
          # Exemple confirmé par la source FR: la fiche 1031761 expose card_1031760_thumb.png.
          print("éveils avec visuel voisin disponible mais non validé",len(sibling))
          # Échantillons validés manuellement contre les assets affichés par la base FR.
          # 1009371 -> card_1009370_* est confirmé par la fiche française.
          confirmed_resource_samples={"1009371":"1009370","1031761":"1031760"}
          # Conserver ces validations comme ancres seulement : aucune généralisation.
          # Une relation officielle peut être confirmée alors que le fichier local reste à importer.
          local_anchor_missing=[]
          for logical,resource in confirmed_resource_samples.items():
              if not any((assets/(resource+ext)).exists() for ext in (".webp",".png",".jpg",".jpeg")):
                  local_anchor_missing.append((logical,resource))
          print("resourceId échantillons FR confirmés",confirmed_resource_samples)
          print("assets locaux encore absents pour ancres confirmées",local_anchor_missing)
          if sibling: print("exemples éveils voisins",sibling[:50])
          sibling_ids={b for _,b,_ in sibling}
          independent=[x for x in missing if x[1] not in sibling_ids]
          print("images réellement indépendantes à retrouver",len(independent))
          if independent: print("premiers IDs indépendants",independent[:100])
          from collections import Counter
          buckets=Counter(cid[:4] for _,cid in independent if len(cid)>=4)
          print("répartition images indépendantes par préfixe",dict(sorted(buckets.items())))
          old=[x for x in independent if int(x[1])<1025000]
          recent=[x for x in independent if int(x[1])>=1025000]
          print("indépendantes anciennes",len(old),"récentes",len(recent))
          if old: print("IDs indépendants anciens prioritaires",old)
          recent_buckets={}
          for item in recent:
              recent_buckets.setdefault(item[1][:4],[]).append(item)
          for k in sorted(recent_buckets):
              print("lot récent",k,"count",len(recent_buckets[k]),"ids",recent_buckets[k][:60])
          # Le rapport doit rester visible dans les logs CI, même sans artefact.
          if missing:
              print("premiers IDs sans couverture exacte",missing[:50])
          PY
      - name: UI source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("app.js").read_text(encoding="utf-8")
          assert "function frCardName" in s
          assert "function frTerm" in s
          assert "function cardImageCandidates" in s
          assert "return cardId;" in s, "unsafe implicit awakening resource alias may have returned"
          assert "cardId.slice(0,-1)+'0'" not in s, "unsafe ...1 -> ...0 image alias detected"
          assert "c.image=choice?.image||'assets/cards/'+a.candidateId+'.webp'" not in s, "restored cards bypass exact artwork resolver"
          assert "c.title=frTerm(c.title||'')" in s, "box titles bypass French mapper"
          print("French/image runtime invariants OK")
          # Historical audit is diagnostic only: it still records broken remote artwork.
          import json
          hist=Path("docs/IMAGE-AUDIT-FINAL.json")
          if hist.exists():
              h=json.loads(hist.read_text(encoding="utf-8"))
              print("historical broken remote images",len(h.get("brokenImages",[])))
              assert h.get("idImageMismatches",[])==[], "known ID/image mismatches remain"
          print("Historical image audit must not be treated as clean merely because stillMissing is empty")
          PY
      - name: Required PWA files
        run: |
          test -f assets/icon-192.png
          test -f assets/icon-512.png
          test -f style.css
          echo "PWA core OK"
