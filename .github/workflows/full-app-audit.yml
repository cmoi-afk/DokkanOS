name: Full application audit
on:
  push:
    branches: [fix/full-app-audit-v161, design/interface-v17, feat/companion-v18, feat/copilot-v19, feat/progression-v20, data/global-20261002, feat/sp-farming-v202, feat/team-category-v203, feat/battle-results-v204, design/global-interface-v210, fix/capture-overlaps-v211]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression checks
        run: |
          for script in tools/test_teams.cjs tools/test_team_builder.cjs tools/test_team_quality.cjs tools/test_catalogue.cjs tools/test_catalogue_data.cjs tools/test_v071.cjs tools/test_sw.cjs tools/test_events.cjs tools/test_audit_regressions.cjs tools/test_companion.cjs tools/test_copilot.cjs tools/test_progression.cjs tools/test_data_download.cjs tools/test_sa_farm.cjs tools/test_sa_farm_model.cjs tools/test_team_category.cjs tools/test_team_battles.cjs; do node "$script"; done
      - run: python -m pip install --quiet pillow numpy
      - run: python tools/test_capture_overlaps.py
      - run: npm install --prefix /tmp/dokkan-tests --no-save --ignore-scripts linkedom@0.18.12 playwright@1.58.2
      - run: /tmp/dokkan-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser audit, mobile, desktop and offline
        run: |
          python -m http.server 8765 > /tmp/dokkan-server.log 2>&1 &
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_capture_overlaps_dom.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_capture_overlaps_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_experience_dom.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_companion_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_experience_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_team_category_dom.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/test_team_battles_dom.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_team_battles_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_team_category_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_sa_farm_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_data_download_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_progression_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_app_browser.cjs
          NODE_PATH=/tmp/dokkan-tests/node_modules node tools/audit_copilot_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-app-audit
          path: audit-artifacts
          retention-days: 14
