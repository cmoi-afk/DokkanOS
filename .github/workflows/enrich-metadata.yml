name: Enrich Dokkan metadata
on:
  workflow_dispatch:
  push:
    branches: [dev/v0.3-foundations]
    paths: [data.json, tools/enrich_identity.py]
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/v0.3-foundations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/enrich_identity.py
      - name: Commit metadata
        run: |
          if git diff --quiet card-meta.json; then exit 0; fi
          git config user.name "DokkanOS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add card-meta.json
          git commit -m "data: enrich card identities from Dokkan dataset"
          git push
