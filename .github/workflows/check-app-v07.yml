name: Check v0.7 application
on:
  push:
    branches: [data/catalog-fr-completion-v07]
    paths:
      - app.js
      - .github/workflows/check-app-v07.yml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - name: Check ownership across awakening forms
        run: |
          node <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const script=fs.readFileSync('app.js','utf8');
          const catalogue={cards:[
            {id:'100',rarity:'SSR',awakensTo:'101'},
            {id:'101',rarity:'UR',awakensTo:'102'},
            {id:'102',rarity:'LR'},
            {id:'200',rarity:'UR'}
          ]};
          const context={console,window:{addEventListener(){}},navigator:{onLine:true},localStorage:{setItem(){},getItem(){return null}},document:{querySelector(){return {innerHTML:'',textContent:''}},addEventListener(){},querySelectorAll(){return []}},alert(){throw Error('Unexpected alert')}};
          vm.createContext(context);
          vm.runInContext(script+'\nCATALOG='+JSON.stringify(catalogue)+'; DB={cards:[]}; inventory={};',context);
          assert.equal(vm.runInContext('catalogFamilies().length',context),2);
          vm.runInContext("inventory['100']='owned'",context);
          assert.equal(vm.runInContext("inventoryState({id:'102'})",context),'owned');
          vm.runInContext("delete inventory['100']; inventory['102']='missing'",context);
          assert.equal(vm.runInContext("inventoryState({id:'100'})",context),'missing');
          assert.equal(vm.runInContext('catalogFamilies().length',context),2);
          JS
