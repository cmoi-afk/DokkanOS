name: DokkanOS full catalogue asset audit
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/audit_catalog_assets.py"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/audit_catalog_assets.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CATALOG-ASSET-AUDIT-v0.9.11.json
          git commit -m "Audit all catalogue IDs against local assets" || exit 0
          git push
