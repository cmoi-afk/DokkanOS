name: Repair final card images individually

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repair-final-images.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Repair cards independently
        shell: bash
        run: |
          python tools/repair_final_images.py
      - name: Commit successful repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards catalog.json docs/FINAL-IMAGE-REPAIR.json
          if ! git diff --cached --quiet; then
            git commit -m "Repair final card images individually"
            git push
          fi
